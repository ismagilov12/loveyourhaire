<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Підтвердіть замовлення — Love Your Haire</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --text: #f5f5f5;
    --text-dim: #999;
    --border: #2a2a2a;
    --tg: #2aabee;
    --tg-hover: #1f8cc4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 24px 20px;
  }
  .wrap {
    width: 100%;
    max-width: 460px;
    margin: auto;
    text-align: center;
  }
  .brand {
    letter-spacing: 0.18em;
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  h1 {
    font-size: clamp(26px, 6vw, 32px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 28px;
    line-height: 1.2;
  }
  .order-id {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    margin-bottom: 24px;
    color: var(--text-dim);
    font-size: 14px;
    display: inline-block;
  }
  .order-id.hidden { display: none; }
  .order-id b { color: var(--text); font-weight: 600; }
  .tg-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 18px 20px;
    background: var(--tg);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .tg-btn:hover { background: var(--tg-hover); }
  .tg-btn:active { transform: scale(0.98); }
  .tg-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
  .footer-link {
    margin-top: 32px;
  }
  .footer-link a {
    color: var(--text-dim);
    font-size: 13px;
    text-decoration: none;
  }
  .footer-link a:hover { color: var(--text); }
  @media (max-width: 480px) {
    body { padding: 20px 16px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="brand">Love Your Haire</div>

  <h1>Підтвердіть замовлення<br>в Telegram</h1>

  <div class="order-id hidden" id="orderBox">
    Замовлення <b id="orderValue">—</b>
  </div>

  <a href="#" class="tg-btn" id="tgBtn">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
    </svg>
    <span>Підтвердити в Telegram</span>
  </a>

  <div class="footer-link">
    <a href="https://loveyourhaire.shop" id="backLink">← Повернутися на сайт</a>
  </div>

</div>

<script>
  var BOT_USERNAME = "loveyourhaire_bot";
  var SITE_URL = "https://loveyourhaire.shop";

  (function () {
    var params = new URLSearchParams(window.location.search);
    var orderId = params.get("order") || params.get("tranid") || params.get("orderid") || "";
    orderId = String(orderId).trim();

    if (orderId && orderId !== "{tranid}" && orderId !== "{orderid}") {
      document.getElementById("orderValue").textContent = "#" + orderId;
      document.getElementById("orderBox").classList.remove("hidden");
    }

    var payload = orderId ? ("order_" + orderId.replace(/[^a-zA-Z0-9_-]/g, "")) : "thanks";
    var tgUrl = "https://t.me/" + BOT_USERNAME + "?start=" + payload;

    var btn = document.getElementById("tgBtn");
    btn.setAttribute("href", tgUrl);
    btn.setAttribute("target", "_blank");
    btn.setAttribute("rel", "noopener");

    document.getElementById("backLink").setAttribute("href", SITE_URL);

    btn.addEventListener("click", function () {
      try {
        if (window.gtag) gtag("event", "tg_confirm_click", { order_id: orderId || null });
        if (window.ym) ym(window.ymCounterId || 0, "reachGoal", "tg_confirm_click");
      } catch (e) {}
    });
  })();
</script>

</body>
</html>
