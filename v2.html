// ─── ClientsPage ─────────────────────────────────────────────────────────────
function ClientsPage({clients,orders,isMgr}){
  const[search,setSearch]=useState("");
  // Aggregate from orders
  const aggregated=useMemo(()=>{
    const map={};
    orders.forEach(o=>{
      const key=normPhone(o.phone)||(o.client||"").toLowerCase();
      if(!key)return;
      if(!map[key])map[key]={name:o.client,phone:o.phone,city:o.city,npBranch:o.npBranch,orders:0,total:0,lastDate:o.date};
      map[key].orders++;
      map[key].total+=o.total||0;
      if(new Date(o.date)>new Date(map[key].lastDate))map[key].lastDate=o.date;
    });
    return Object.values(map).sort((a,b)=>b.total-a.total);
  },[orders]);

  const filtered=useMemo(()=>{
    if(!search)return aggregated;
    const q=search.toLowerCase();
    return aggregated.filter(c=>(c.name||"").toLowerCase().includes(q)||normPhone(c.phone).includes(normPhone(search))||(c.city||"").toLowerCase().includes(q));
  },[aggregated,search]);

  return<div className="col gap-12">
    <div className="search-input" style={{maxWidth:400}}>
      <Icon name="search" size={16}/>
      <input className="input" placeholder="Пошук клієнта" value={search} onChange={e=>setSearch(e.target.value)}/>
    </div>
    <div className="card" style={{padding:0,overflow:"hidden"}}>
      <table className="tbl">
        <thead><tr><th>Клієнт</th><th>Місто</th><th style={{textAlign:"right"}}>Замовлень</th><th style={{textAlign:"right"}}>Сума</th><th>Останнє</th></tr></thead>
        <tbody>
          {filtered.slice(0,200).map((c,i)=>{
            const tg=tgLink(c.phone);
            return<tr key={i}>
              <td>
                <div className="fw-700">{c.name||"—"}</div>
                <div className="muted-2 text-sm row gap-4">{fmtPhone(c.phone)}{tg&&<a href={tg} target="_blank" rel="noopener">✈</a>}</div>
              </td>
              <td className="text-sm">{c.city||"—"}{c.npBranch&&<span className="muted-2"> · №{c.npBranch}</span>}</td>
              <td className="text-right fw-700">{c.orders}</td>
              <td className="text-right fw-700">{fmt(c.total)}</td>
              <td className="muted-2 text-sm">{fmtD(c.lastDate)}</td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>
    {filtered.length>200&&<div className="muted text-sm text-center">Показано перші 200 з {filtered.length}</div>}
  </div>;
}

// ─── ChatPage ────────────────────────────────────────────────────────────────
function ChatPage({user,orders}){
  const[conversations,setConversations]=useState([]);
  const[selectedConv,setSelectedConv]=useState(null);
  const[messages,setMessages]=useState([]);
  const[text,setText]=useState("");
  const[loading,setLoading]=useState(true);
  const[sending,setSending]=useState(false);
  const scrollRef=useRef(null);

  useEffect(()=>{
    if(!supabase){setLoading(false);return;}
    (async()=>{
      const{data}=await supabase.from("conversations").select("*").order("last_message_at",{ascending:false}).limit(100);
      setConversations(data||[]);
      setLoading(false);
    })();
  },[]);

  useEffect(()=>{
    if(!selectedConv||!supabase)return;
    (async()=>{
      const{data}=await supabase.from("messages").select("*").eq("conversation_id",selectedConv.id).order("created_at",{ascending:true}).limit(200);
      setMessages(data||[]);
      setTimeout(()=>scrollRef.current?.scrollTo(0,scrollRef.current.scrollHeight),50);
    })();
  },[selectedConv]);

  // Realtime
  useEffect(()=>{
    if(!supabase||!selectedConv)return;
    const ch=supabase.channel("v2_chat_"+selectedConv.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"conversation_id=eq."+selectedConv.id},payload=>{
      setMessages(m=>[...m,payload.new]);
      setTimeout(()=>scrollRef.current?.scrollTo(0,scrollRef.current.scrollHeight),50);
    }).subscribe();
    return()=>{try{ch.unsubscribe();}catch{}};
  },[selectedConv]);

  const send=async()=>{
    if(!text.trim()||!selectedConv)return;
    setSending(true);
    const r=await fetch(window.TG_SEND_URL,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({conversation_id:selectedConv.id,text:text.trim(),sent_by:user?.login||"manager"})
    });
    setSending(false);
    if(r.ok){setText("");}else{toast("Не вдалося надіслати","error");}
  };

  const filteredConvs=conversations;

  return<div className="grid" style={{gridTemplateColumns:"280px 1fr",gap:0,height:"calc(100vh - 120px)",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--r-md)",overflow:"hidden"}}>
    {/* Conversations list */}
    <div style={{borderRight:"1px solid var(--border)",overflowY:"auto"}}>
      <div style={{padding:"14px 16px",borderBottom:"1px solid var(--border)",fontWeight:700,fontSize:14}}>Діалоги <span className="muted-2 text-sm">({filteredConvs.length})</span></div>
      {loading?<div className="empty"><span className="spinner"/></div>:filteredConvs.length===0?<div className="empty muted">Немає діалогів</div>:
        filteredConvs.map(c=>
          <div key={c.id} onClick={()=>setSelectedConv(c)} style={{padding:"12px 16px",borderBottom:"1px solid var(--border)",cursor:"pointer",background:selectedConv?.id===c.id?"var(--pink-soft)":"transparent"}}>
            <div className="row" style={{justifyContent:"space-between"}}>
              <div className="fw-700 truncate" style={{maxWidth:160}}>{c.client_name||c.telegram_username||"Гість"}</div>
              {c.unread_count>0&&<span className="badge badge-pink">{c.unread_count}</span>}
            </div>
            <div className="muted-2 text-sm truncate" style={{maxWidth:230}}>{c.telegram_username?"@"+c.telegram_username:""}</div>
            <div className="muted-2 text-sm">{fmtDT(c.last_message_at)}</div>
          </div>
        )
      }
    </div>
    {/* Messages */}
    <div style={{display:"flex",flexDirection:"column",minHeight:0}}>
      {!selectedConv?<div className="empty muted" style={{height:"100%",justifyContent:"center"}}><Icon name="chat" size={32}/><div>Виберіть діалог зліва</div></div>:
        <>
          <div style={{padding:"14px 18px",borderBottom:"1px solid var(--border)",fontWeight:700}}>
            {selectedConv.client_name||selectedConv.telegram_username||"Гість"}
            <div className="muted-2 text-sm">{selectedConv.telegram_username?"@"+selectedConv.telegram_username:""}</div>
          </div>
          <div ref={scrollRef} style={{flex:1,overflowY:"auto",padding:18,background:"var(--surface-2)"}}>
            {messages.map(m=>{
              const isOut=m.direction==="outgoing"||m.direction==="out";
              return<div key={m.id} style={{display:"flex",justifyContent:isOut?"flex-end":"flex-start",marginBottom:8}}>
                <div style={{maxWidth:"70%",padding:"8px 12px",borderRadius:12,background:isOut?"var(--pink)":"#fff",color:isOut?"#fff":"var(--text)",fontSize:13,border:isOut?"none":"1px solid var(--border)"}}>
                  <div>{m.content}</div>
                  <div style={{fontSize:10,opacity:.7,marginTop:4,textAlign:"right"}}>{fmtDT(m.created_at)}</div>
                </div>
              </div>;
            })}
          </div>
          <div style={{padding:"12px 16px",borderTop:"1px solid var(--border)",display:"flex",gap:8}}>
            <input className="input flex-1" value={text} onChange={e=>setText(e.target.value)} placeholder="Повідомлення…" onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}/>
            <button className="btn btn-primary" onClick={send} disabled={sending||!text.trim()}>{sending?<span className="spinner"/>:<Icon name="send" size={16}/>}</button>
          </div>
        </>
      }
    </div>
  </div>;
}

  }>
    <div><label className="label">Категорія</label><select className="select" value={e.category} onChange={ev=>setE({...e,category:ev.target.value})}>{EXPENSE_CATS.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
    <div><label className="label">Дата</label><input className="input" type="date" value={(e.date||"").slice(0,10)} onChange={ev=>setE({...e,date:new Date(ev.target.value).toISOString()})}/></div>
    <div><label className="label">Сума</label><input className="input" type="number" value={e.amount||0} onChange={ev=>setE({...e,amount:Number(ev.target.value)})}/></div>
    <div><label className="label">Примітка</label><textarea className="textarea" rows={2} value={e.note||""} onChange={ev=>setE({...e,note:ev.target.value})}/></div>
  </Modal>;
}

// ─── PaymentsPage ────────────────────────────────────────────────────────────
function PaymentsPage({payments,orders,updateOrder}){
  const[filter,setFilter]=useState("unmatched");
  const filtered=payments.filter(p=>{
    if(filter==="unmatched")return!p.matched_order_id&&p.transaction_status==="Approved";
    if(filter==="approved")return p.transaction_status==="Approved";
    return true;
  });
  return<div className="col gap-12">
    <div className="row gap-6">
      <button className={"pill "+(filter==="unmatched"?"active":"")} onClick={()=>setFilter("unmatched")}>Незаматчені</button>
      <button className={"pill "+(filter==="approved"?"active":"")} onClick={()=>setFilter("approved")}>Усі підтверджені</button>
      <button className={"pill "+(filter==="all"?"active":"")} onClick={()=>setFilter("all")}>Усі</button>
    </div>
    <div className="card" style={{padding:0}}>
      <table className="tbl">
        <thead><tr><th>Дата</th><th>Клієнт</th><th>Order Ref</th><th style={{textAlign:"right"}}>Сума</th><th>Статус</th><th>Заказ</th></tr></thead>
        <tbody>
          {filtered.map(p=><tr key={p.id}>
            <td className="text-sm">{fmtDT(p.received_at)}</td>
            <td>
              <div className="fw-600">{p.client_name||"—"}</div>
              <div className="muted-2 text-sm">{fmtPhone(p.client_phone)}</div>
            </td>
            <td className="text-sm" style={{fontFamily:"monospace"}}>{p.order_reference}</td>
            <td className="text-right fw-700">{fmt(p.amount)}</td>
            <td><span className={"badge "+(p.transaction_status==="Approved"?"badge-green":"badge-amber")}>{p.transaction_status}</span></td>
            <td>{p.matched_order_id?<a href="#" onClick={ev=>ev.preventDefault()} className="text-sm">#{String(p.matched_order_id).slice(-4)}</a>:<span className="muted-2 text-sm">—</span>}</td>
          </tr>)}
        </tbody>
      </table>
    </div>
  </div>;
}

// ─── BulkImportPage ──────────────────────────────────────────────────────────
function BulkImportPage({addOrder}){
  const[text,setText]=useState("");
  return<div className="card">
    <div className="card-header"><Icon name="upload" size={18}/><div className="card-title">Масовий імпорт</div></div>
    <div className="muted text-sm mb-12">Парсер v2 буде доданий пізніше. Поки що — використовуй v1 (<a href="/" style={{color:"var(--pink)"}}>головна</a>) для масового імпорту, а потім переходь сюди.</div>
    <textarea className="textarea" rows={10} value={text} onChange={e=>setText(e.target.value)} placeholder="Вставте текст замовлень (поки що недоступно у v2)"/>
    <button className="btn btn-secondary mt-12" disabled>Парсити (TODO)</button>
  </div>;
}




ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
