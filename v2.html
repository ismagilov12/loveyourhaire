<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fff5f5">
<title>Love Your Haire — CRM v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#fafafa;
  --surface:#fff;
  --surface-2:#f7f7f8;
  --border:#ececec;
  --border-strong:#dcdcdc;
  --text:#1a1a1a;
  --text-2:#6b6b6b;
  --text-3:#999;
  --pink:#e8527a;
  --pink-soft:#fdeef2;
  --pink-2:#c93d63;
  --gold:#c19a4a;
  --green:#2c8a5f;
  --green-soft:#e6f4ed;
  --red:#c44b4b;
  --red-soft:#fbeaea;
  --blue:#4a7fc4;
  --blue-soft:#e8eff9;
  --amber:#c97e1a;
  --amber-soft:#fbf0dc;
  --purple:#7c5cc8;
  --np-red:#d42a2a;
  --r-sm:8px;
  --r-md:12px;
  --r-lg:16px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.06);
  --shadow-lg:0 8px 24px rgba(0,0,0,.08);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* ─── Layout ─── */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:#1a1a1a;color:#e5e5e5;padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{padding:8px 12px 16px;border-bottom:1px solid #2a2a2a;margin-bottom:12px}
.sidebar-logo-title{font-size:15px;font-weight:800;color:#fff;letter-spacing:.3px}
.sidebar-logo-sub{font-size:11px;color:#7a7a7a;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#b5b5b5;font-weight:500;font-size:13px;transition:all .15s;cursor:pointer}
.nav-item:hover{background:#2a2a2a;color:#fff}
.nav-item.active{background:var(--pink);color:#fff}
.nav-item.active svg{stroke:#fff}
.nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#666;padding:14px 12px 6px;font-weight:700}
.sidebar-user{margin-top:auto;padding:12px;border-top:1px solid #2a2a2a;display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--pink-2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.user-meta{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:#888}
.user-logout{padding:6px;border-radius:6px;color:#888}
.user-logout:hover{background:#2a2a2a;color:var(--pink)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.topbar-title{font-size:18px;font-weight:700;flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}
.page{padding:24px;flex:1}

/* ─── Components ─── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;transition:box-shadow .15s}
.card:hover{box-shadow:var(--shadow-sm)}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:700}
.card-sub{font-size:12px;color:var(--text-2);font-weight:500}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;font-weight:600;font-size:13px;transition:all .15s;border:1px solid transparent;line-height:1;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--pink);color:#fff}
.btn-primary:hover{background:var(--pink-2)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#a03c3c}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#1f6b48}
.btn-icon{padding:8px;border-radius:8px;background:transparent;color:var(--text-2)}
.btn-icon:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-lg{padding:12px 20px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.input,.select,.textarea{width:100%;padding:9px 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);transition:border-color .15s,box-shadow .15s;font-size:13px}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.input-sm{padding:6px 10px;font-size:12px}
.label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.field{margin-bottom:14px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.4;white-space:nowrap}
.badge-neutral{background:var(--surface-2);color:var(--text-2)}
.badge-pink{background:var(--pink-soft);color:var(--pink-2)}
.badge-green{background:var(--green-soft);color:var(--green)}
.badge-blue{background:var(--blue-soft);color:var(--blue)}
.badge-amber{background:var(--amber-soft);color:var(--amber)}
.badge-red{background:var(--red-soft);color:var(--red)}

/* status colors via badge variants */
.st-new{background:var(--pink-soft);color:var(--pink-2)}
.st-ttn{background:var(--amber-soft);color:var(--amber)}
.st-toSend{background:var(--blue-soft);color:var(--blue)}
.st-shipped{background:var(--blue-soft);color:var(--blue)}
.st-atPost{background:#fff5d6;color:#b07e0c}
.st-received{background:var(--green-soft);color:var(--green)}
.st-delivered{background:var(--green-soft);color:var(--green)}
.st-refused{background:var(--red-soft);color:var(--red)}
.st-studio{background:#ecdef9;color:var(--purple)}
.st-returning{background:#ffeed4;color:#b95a00}
.st-returned{background:var(--surface-2);color:var(--text-2)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border-strong);font-weight:600;font-size:12px;color:var(--text-2);transition:all .15s;cursor:pointer}
.pill:hover{background:var(--surface-2);color:var(--text)}
.pill.active{background:var(--text);color:#fff;border-color:var(--text)}
.pill-count{background:rgba(0,0,0,.07);padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700}
.pill.active .pill-count{background:rgba(255,255,255,.2)}

.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:6px}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}
.muted{color:var(--text-2)}
.muted-2{color:var(--text-3)}
.fw-600{font-weight:600}.fw-700{font-weight:700}
.text-sm{font-size:12px}.text-lg{font-size:16px}.text-xl{font-size:22px}.text-2xl{font-size:28px}

/* KPI cards — flat with top color bar */
.kpi{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;overflow:hidden;transition:all .15s}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--pink))}
.kpi-label{font-size:12px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.kpi-value{font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.kpi-sub{font-size:12px;color:var(--text-3);font-weight:500;margin-top:6px}
.kpi-delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:6px}
.kpi-delta.up{background:var(--green-soft);color:var(--green)}
.kpi-delta.down{background:var(--red-soft);color:var(--red)}

/* Orders table */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--surface-2);text-align:left;font-weight:600;color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:11px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr.selected{background:var(--pink-soft)}
.tbl tbody tr:last-child td{border-bottom:none}

/* Mobile cards (orders) */
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px;transition:all .15s}
.order-card:hover{box-shadow:var(--shadow-sm)}
.order-card.selected{border-color:var(--pink);background:#fffafb}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,20,20,.45);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:560px;padding:24px;box-shadow:var(--shadow-lg);position:relative}
.modal-lg{max-width:780px}
.modal-xl{max-width:980px}
.modal-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.modal-title{flex:1;font-size:17px;font-weight:700}
.modal-close{padding:6px;border-radius:6px;color:var(--text-2)}
.modal-close:hover{background:var(--surface-2);color:var(--text)}
.modal-body{display:flex;flex-direction:column;gap:14px}
.modal-footer{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* Toast */
.toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:360px}
.toast{background:var(--text);color:#fff;padding:12px 16px;border-radius:8px;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:var(--shadow-lg);animation:slideIn .25s ease}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.warn{background:var(--amber)}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 16px;color:var(--text-3);text-align:center}
.empty-icon{width:48px;height:48px;background:var(--surface-2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:4px}

/* Loading */
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Filter bar */
.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.search-input{flex:1;min-width:200px;max-width:340px;position:relative}
.search-input input{padding-left:34px}
.search-input svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}

/* Login */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#fff5f5,#fdeef2 50%,#fff)}
.login-card{background:var(--surface);border-radius:var(--r-lg);padding:36px;width:100%;max-width:380px;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo-mark{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--pink-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;margin:0 auto 12px}
.login-title{font-size:20px;font-weight:800;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text-2)}

/* Onboarding (manager 5 slides) */
.onb-backdrop{position:fixed;inset:0;background:rgba(20,20,20,.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
.onb-card{background:var(--surface);border-radius:var(--r-lg);padding:32px;max-width:460px;width:100%;text-align:center;box-shadow:var(--shadow-lg)}
.onb-dots{display:flex;justify-content:center;gap:6px;margin:18px 0}
.onb-dot{width:7px;height:7px;border-radius:50%;background:var(--border)}
.onb-dot.active{background:var(--pink);width:20px;border-radius:4px}

/* Audit log entries */
.audit-entry{display:flex;gap:10px;padding:10px 12px;border-left:3px solid var(--border);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:12px}
.audit-entry.action-redirect{border-color:var(--blue)}
.audit-entry.action-forward{border-color:var(--purple)}
.audit-entry.action-return{border-color:var(--red)}
.audit-entry.action-cod_change{border-color:var(--amber)}
.audit-entry.action-status_change{border-color:var(--green)}
.audit-action{font-weight:700}
.audit-time{color:var(--text-3);margin-left:auto}

/* Bulk-TTN highlight banner */
.bulk-banner{background:linear-gradient(135deg,var(--pink),var(--pink-2));color:#fff;padding:14px 18px;border-radius:var(--r-md);display:flex;align-items:center;gap:14px;margin-bottom:16px;box-shadow:var(--shadow-md);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 12px rgba(232,82,122,.25)}50%{box-shadow:0 4px 20px rgba(232,82,122,.45)}}
.bulk-banner-icon{width:40px;height:40px;background:rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center}
.bulk-banner-text{flex:1}
.bulk-banner-title{font-weight:800;font-size:15px;margin-bottom:2px}
.bulk-banner-sub{font-size:12px;opacity:.9}
.bulk-banner button{background:#fff;color:var(--pink-2);font-weight:700;padding:10px 18px;border-radius:8px}
.bulk-banner button:hover{background:rgba(255,255,255,.92)}

/* Donut chart */
.donut-wrap{position:relative;width:160px;height:160px}
.donut-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-label-value{font-size:22px;font-weight:800}
.donut-label-sub{font-size:11px;color:var(--text-2)}

/* Mobile responsiveness */
@media(max-width:900px){
  .sidebar{display:none}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr}
  .page{padding:16px;padding-bottom:80px}
  .topbar{padding:12px 16px}
  .topbar-title{font-size:16px}
  .mobile-nav{display:flex !important}
  .tbl{font-size:12px}
  .tbl th,.tbl td{padding:8px 6px}
}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;border-top:1px solid #333;padding:6px;justify-content:space-around;z-index:50}
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;color:#888;font-size:10px;font-weight:600;border-radius:8px;flex:1;cursor:pointer}
.mobile-nav-item.active{color:var(--pink)}

/* Manager actions sidebar in edit modal */
.actions-rail{display:flex;flex-direction:column;gap:6px}
.action-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);text-align:left;cursor:pointer;transition:all .15s;width:100%}
.action-btn:hover{border-color:var(--pink);background:var(--pink-soft)}
.action-btn-icon{width:32px;height:32px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0}
.action-btn:hover .action-btn-icon{background:#fff;color:var(--pink)}
.action-btn-content{flex:1;min-width:0}
.action-btn-title{font-weight:700;font-size:13px;line-height:1.2}
.action-btn-sub{font-size:11px;color:var(--text-2);margin-top:2px}

/* Subtle leopard accent (brand identifier) — small element only */
.brand-mark{position:relative;overflow:hidden}
.brand-mark::after{content:"";position:absolute;top:0;right:-20px;width:40px;height:100%;background:
  radial-gradient(ellipse 6px 4px at 30% 30%,#7a4a1c 60%,transparent 70%),
  radial-gradient(ellipse 5px 3px at 70% 50%,#7a4a1c 60%,transparent 70%),
  radial-gradient(ellipse 7px 5px at 40% 75%,#7a4a1c 60%,transparent 70%),
  linear-gradient(135deg,#d4a054,#c19a4a);opacity:.85;border-radius:50%}

/* Stock low alert */
.alert-stock{display:flex;align-items:center;gap:8px;background:var(--amber-soft);color:var(--amber);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600}

/* Inline edit */
.inline-edit{padding:2px 6px;border:1px dashed transparent;border-radius:4px;cursor:text;transition:all .15s}
.inline-edit:hover{border-color:var(--border-strong);background:var(--surface-2)}
.inline-edit:focus{outline:none;border-color:var(--pink);background:#fff;border-style:solid}

/* Stage timeline */
.timeline{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.tl-step{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;font-size:11px;font-weight:600}
.tl-step.done{background:var(--green-soft);color:var(--green)}
.tl-step.current{background:var(--pink);color:#fff}
.tl-step.pending{background:var(--surface-2);color:var(--text-3)}
.tl-arrow{color:var(--text-3);margin:0 2px}

/* Small */
.divider{height:1px;background:var(--border);margin:14px 0}
.flex-1{flex:1}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-24{gap:24px}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.text-center{text-align:center}.text-right{text-align:right}
.w-full{width:100%}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-sm{width:14px;height:14px}.icon-md{width:16px;height:16px}.icon-lg{width:20px;height:20px}
</style>
</head>

}

const normPhoneNP=p=>{const s=String(p||'').replace(/\D/g,'');if(s.length===10)return '380'+s.slice(1);if(s.length===12&&s.startsWith('380'))return s;return s;};
const TTNRefCache={
  KEY:'lyh2_ttn_refs',
  _read(){try{return JSON.parse(localStorage.getItem(TTNRefCache.KEY)||'{}');}catch{return{};}},
  _write(o){try{localStorage.setItem(TTNRefCache.KEY,JSON.stringify(o));}catch{}},
  set(num,ref){if(!num||!ref)return;const o=TTNRefCache._read();o[String(num)]=String(ref);TTNRefCache._write(o);},
  get(num){if(!num)return'';const o=TTNRefCache._read();return o[String(num)]||'';},
  remove(num){const o=TTNRefCache._read();delete o[String(num)];TTNRefCache._write(o);}
};
const NP={
  async call(model,method,props={}){
    try{
      const r=await fetch(window.NP_API,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({apiKey:window.NP_API_KEY,modelName:model,calledMethod:method,methodProperties:props})
      });
      const j=await r.json();
      if(!j.success)console.warn("NP API error:",j.errors);
      return j;
    }catch(e){console.error("NP fetch error:",e);return{success:false,data:[],errors:[e.message]};}
  },
  // Russian/Ukrainian typos -> canonical Ukrainian form used by NP
  _ruToUa:{"киев":"київ","харьков":"харків","одесса":"одеса","львов":"львів","днепр":"дніпро","запорожье":"запоріжжя","николаев":"миколаїв","винница":"вінниця","черкассы":"черкаси","чернигов":"чернігів","тернополь":"тернопіль","ровно":"рівне","кременчуг":"кременчук","хмельницкий":"хмельницький","луцк":"луцьк","кировоград":"кропивницький","черновцы":"чернівці","ивано-франковск":"івано-франківськ","белая церковь":"біла церква","никополь":"нікополь","бердянск":"бердянськ","краматорск":"краматорськ","мариуполь":"маріуполь","мелитополь":"мелітополь","измаил":"ізмаїл","александрия":"олександрія","ахтырка":"охтирка","славянск":"словянськ","луганск":"луганськ","донецк":"донецьк","сумы":"суми","полтава":"полтава","херсон":"херсон","житомир":"житомир","бровары":"бровари","сімферополь":"сімферополь","симферополь":"сімферополь","севастополь":"севастополь","горловка":"горлівка","макеевка":"макіївка","павлоград":"павлоград","алчевск":"алчевськ","северодонецк":"сєвєродонецьк","каменец-подольский":"кам\"янець-подільський","конотоп":"конотоп","умань":"умань","шостка":"шостка","ужгород":"ужгород","борисполь":"бориспіль","ирпень":"ірпінь","буча":"буча","вышгород":"вишгород","каменское":"кам\"янське","мукачево":"мукачево","стрый":"стрий","коломыя":"коломия"},
  // Normalize user-entered city string for matching and search
  _normCity(s){
    if(!s)return"";
    let r=String(s).toLowerCase()
      .replace(/[\u2019\u02bc\u0060\u00b4]/g,"'")
      .replace(/ё/g,"е")
      .replace(/^\s*(м\.|с\.|смт\.?|пгт\.?|місто|село|пос\.|п\.)\s*/i,"")
      .replace(/,.*$/,"")
      .replace(/\s+(область|обл\.|район|р-н)[^,]*/i,"")
      .replace(/\s+україна$/i,"")
      .trim();
    if(NP._ruToUa[r])r=NP._ruToUa[r];
    return r;
  },
  async _callSearch(q){
    if(!q||q.length<2)return[];
    const r=await NP.call("Address","searchSettlements",{CityName:q,Limit:"20"});
    if(!r.success||!r.data||!r.data[0])return[];
    return(r.data[0].Addresses||[]).map(a=>({ref:a.Ref,deliveryCityRef:a.DeliveryCity||a.Ref,name:a.Present,city:a.MainDescription,area:a.Area,region:a.Region,settlementType:a.SettlementTypeCode||""}));
  },
  async searchCity(q){
    if(!q||q.length<2)return[];
    // Try multiple variants: original, normalized (prefix/region stripped + RU->UA), just first word
    const tried=new Set();
    const variants=[q, NP._normCity(q)];
    const firstWord=(NP._normCity(q)||q).split(/\s+/)[0];
    if(firstWord&&firstWord.length>=2)variants.push(firstWord);
    let best=[];
    for(const v of variants){
      const key=v.toLowerCase().trim();
      if(!key||tried.has(key))continue;
      tried.add(key);
      const res=await NP._callSearch(v);
      if(res.length){best=res;break;}
    }
    return best;
  },
  async getWarehouses(cityRef,q=""){
    if(!cityRef)return[];
    const base={Limit:"50"};
    if(q)base.FindByString=q;
    // try SettlementRef first (works for most cases)
    let r=await NP.call("Address","getWarehouses",{...base,SettlementRef:cityRef});
    let arr=r.success&&Array.isArray(r.data)?r.data:[];
    // fallback: try CityRef (needed for postomats in some cases)
    if(!arr.length){
      r=await NP.call("Address","getWarehouses",{...base,CityRef:cityRef});
      arr=r.success&&Array.isArray(r.data)?r.data:[];
    }
    return arr.map(w=>({ref:w.Ref,num:w.Number,desc:w.Description,shortAddr:w.ShortAddress,type:w.TypeOfWarehouse,cityDesc:w.CityDescription}));
  },
  async trackTTN(ttn){
    if(!ttn)return null;
    const r=await NP.call("TrackingDocument","getStatusDocuments",{Documents:[{DocumentNumber:ttn}]});
    if(!r.success||!r.data||!r.data[0])return null;
    const d=r.data[0];
    return{status:d.Status,statusCode:d.StatusCode,city:d.CitySender+" → "+d.CityRecipient,weight:d.DocumentWeight,cost:d.DocumentCost,deliveryCost:d.CostOnSite,scheduledDate:d.ScheduledDeliveryDate,actualDate:d.ActualDeliveryDate,warehouseRecipient:d.WarehouseRecipient,redeliverySum:d.RedeliverySum};
  },
  // Bulk track up to 100 TTNs per call. Returns [{ttn, statusCode, status}, ...] (successful rows only).
  async trackTTNs(ttns){
    const out=[];
    const list=(ttns||[]).filter(Boolean);
    for(let i=0;i<list.length;i+=100){
      const chunk=list.slice(i,i+100);
      const r=await NP.call("TrackingDocument","getStatusDocuments",{Documents:chunk.map(t=>({DocumentNumber:t}))});
      if(r&&r.success&&Array.isArray(r.data)){
        for(const d of r.data){
          if(d&&d.Number)out.push({ttn:String(d.Number),statusCode:String(d.StatusCode||""),status:d.Status||"",scheduledDate:d.ScheduledDeliveryDate||"",redeliverySum:d.RedeliverySum||0});
        }
      }
    }
    return out;
  },
  async calcDeliveryCost(citySenderRef,cityRecipientRef,weight,cost,seatsAmount=1){
    const r=await NP.call("InternetDocument","getDocumentPrice",{
      CitySender:citySenderRef,CityRecipient:cityRecipientRef,
      Weight:String(weight||0.5),ServiceType:"WarehouseWarehouse",
      Cost:String(cost||300),CargoType:"Parcel",SeatsAmount:String(seatsAmount)
    });
    if(!r.success||!r.data||!r.data[0])return null;
    return{cost:r.data[0].Cost,assessedCost:r.data[0].AssessedCost};
  },
  async createTTN(params){
    const r=await NP.call("InternetDocument","save",params);
    if(!r.success)return{ok:false,errors:r.errors};
    const num=r.data[0]?.IntDocNumber,ref=r.data[0]?.Ref;
    if(num&&ref)try{TTNRefCache.set(num,ref);}catch{}
    return{ok:true,ttn:num,ref,cost:r.data[0]?.CostOnSite,estimated:r.data[0]?.EstimatedDeliveryDate};
  },
  // Delete a TTN at NP. Needs the Ref UUID — looks it up by IntDocNumber if not cached,
  // searching getDocumentList in a ±21d window around the supplied orderDateMs.
  async _findTTNRef(ttnNumber,orderDateMs){
    if(!ttnNumber)return"";
    const cached=TTNRefCache.get(ttnNumber);
    if(cached)return cached;
    const fmt=d=>String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
    const center=new Date(orderDateMs||Date.now());
    const from=new Date(center.getTime()-21*24*60*60*1000);
    const to=new Date(center.getTime()+21*24*60*60*1000);
    const r=await NP.call("InternetDocument","getDocumentList",{DateTimeFrom:fmt(from),DateTimeTo:fmt(to),Page:"1",GetFullList:"1"});
    if(r&&r.success&&Array.isArray(r.data)){
      const found=r.data.find(d=>String(d.IntDocNumber)===String(ttnNumber));
      if(found&&found.Ref){try{TTNRefCache.set(ttnNumber,found.Ref);}catch{}return found.Ref;}
    }
    return"";
  },
  async deleteTTN(ttnNumber,orderDateMs){
    if(!ttnNumber)return{ok:false,error:"немає номера ТТН"};
    const ref=await NP._findTTNRef(ttnNumber,orderDateMs);
    if(!ref)return{ok:false,error:"не вдалося знайти Ref для ТТН "+ttnNumber+" (можливо вже видалена або не у вашому акаунті)"};
    const dr=await NP.call("InternetDocument","delete",{DocumentRefs:[ref]});
    if(dr&&dr.success){try{TTNRefCache.remove(ttnNumber);}catch{}return{ok:true};}
    return{ok:false,error:(dr&&dr.errors||["Невідома помилка НП"]).join(", ")};
  },
  // Cache for CargoDescription ref lookup (НП категорія вантажу, напр. "Одяг")
  _cargoRefCache:null,
  async getCargoDescriptionRef(prefer){
    // Returns the Ref for a category matching `prefer` (case-insensitive substring of Description),
    // or the first "Одяг"/"Apparel" category, or the first in the list.
    if(!NP._cargoRefCache){
      try{
        const r=await NP.call("Common","getCargoDescription",{});
        NP._cargoRefCache=(r.success&&Array.isArray(r.data))?r.data:[];
      }catch(e){NP._cargoRefCache=[];}
    }
    const list=NP._cargoRefCache||[];
    if(!list.length)return "";
    const q=(prefer||"").toLowerCase();
    const match=q?list.find(x=>((x.Description||"").toLowerCase().includes(q))||((x.DescriptionRu||"").toLowerCase().includes(q))):null;
    if(match&&match.Ref)return match.Ref;
    const clothes=list.find(x=>/од[ея]г|apparel|cloth/i.test((x.Description||"")+" "+(x.DescriptionRu||"")));
    if(clothes&&clothes.Ref)return clothes.Ref;
    return list[0]?.Ref||"";
  },
  async getSenderInfo(){
    const r=await NP.call("Counterparty","getCounterparties",{CounterpartyProperty:"Sender",Page:"1"});
    if(!r.success||!r.data||!r.data[0])return null;
    const sender=r.data[0];
    // Get sender contact
    const c=await NP.call("Counterparty","getCounterpartyContactPersons",{Ref:sender.Ref,Page:"1"});
    const contact=c.success&&c.data&&c.data[0]?c.data[0]:null;
    // Get sender addresses
    const a=await NP.call("Counterparty","getCounterpartyAddresses",{Ref:sender.Ref,CounterpartyProperty:"Sender"});
    const addr=a.success&&a.data&&a.data[0]?a.data[0]:null;
    return{ref:sender.Ref,contact:contact?{ref:contact.Ref,name:contact.Description,phone:contact.Phones}:null,address:addr?{ref:addr.Ref,desc:addr.Description,cityRef:addr.CityRef}:null};
  },
  async createRecipient(fullName,phone,cityRef){
    // NP allows only Cyrillic letters, space, hyphen, apostrophe in name fields.
    // Sanitize and take at most 3 tokens — extra tokens (product names, numbers) are ignored.
    const sanitize=s=>(s||"").replace(/[^\u0400-\u04FF\s\-'\u2019]/g," ").replace(/\s+/g," ").trim();
    const parts=sanitize(fullName).split(/\s+/).filter(Boolean);
    const lastName=parts[0]||"Клієнт";
    const firstName=parts[1]||".";
    const middleName=parts[2]||"";
    // Save recipient counterparty
    const payload={
      FirstName:firstName,LastName:lastName,
      Phone:normPhoneNP(phone),CounterpartyType:"PrivatePerson",CounterpartyProperty:"Recipient",CityRef:cityRef
    };
    if(middleName)payload.MiddleName=middleName;
    const r=await NP.call("Counterparty","save",payload);
    if(!r.success||!r.data||!r.data[0])return{ok:false,errors:r.errors||["Не вдалося створити отримувача"]};
    const cp=r.data[0];
    // Get contact person ref
    let contactRef=cp.ContactPerson?.data?.[0]?.Ref||"";
    if(!contactRef){
      const c=await NP.call("Counterparty","getCounterpartyContactPersons",{Ref:cp.Ref,Page:"1"});
      if(c.success&&c.data&&c.data[0])contactRef=c.data[0].Ref;
    }
    return{ok:true,ref:cp.Ref,contactRef};
  },
  // Resolve TTN numbers to Refs (for print/scansheet methods).
  // Tries TTNRefCache first; falls back to getDocumentList ±21 days around now.
  async resolveRefs(ttns){
    const out=[];const missing=[];
    for(const t of (ttns||[])){
      if(!t)continue;
      const cached=TTNRefCache.get(t);
      if(cached)out.push({ttn:t,ref:cached}); else missing.push(t);
    }
    if(missing.length){
      const fmt=d=>String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
      const now=new Date();
      const from=new Date(now.getTime()-21*24*60*60*1000);
      const to=new Date(now.getTime()+1*24*60*60*1000);
      try{
        const r=await NP.call("InternetDocument","getDocumentList",{DateTimeFrom:fmt(from),DateTimeTo:fmt(to),Page:"1",GetFullList:"1"});
        if(r&&r.success&&Array.isArray(r.data)){
          const map=new Map();r.data.forEach(d=>{if(d.IntDocNumber&&d.Ref)map.set(String(d.IntDocNumber),d.Ref);});
          for(const t of missing){const ref=map.get(String(t));if(ref){try{TTNRefCache.set(t,ref);}catch{}out.push({ttn:t,ref});}}
        }
      }catch(e){console.warn("resolveRefs lookup failed",e);}
    }
    return out;
  },
  // Insert a list of TTN refs into a single ScanSheet (реєстр прийому-передачі).
  // Returns {ok, ref, number, errors}.
  async createScanSheet(refs){
    const list=(refs||[]).filter(Boolean);
    if(!list.length)return{ok:false,errors:["Немає Ref для реєстру"]};
    const r=await NP.call("ScanSheet","insertDocuments",{DocumentRefs:list});
    if(!r||!r.success)return{ok:false,errors:r&&r.errors||["Не вдалося створити реєстр"]};
    const row=Array.isArray(r.data)?r.data[0]:null;
    return{ok:true,ref:row?.Ref||"",number:row?.Number||"",raw:r.data};
  },
  // Build a direct PDF URL for Nova Poshta print endpoints.
  // Returns a URL the user can open in a new tab to view/download the PDF.
  _printURL(method,refs,type){
    const parts=(refs||[]).filter(Boolean).map(r=>"orders[]/"+encodeURIComponent(r)).join("/");
    return"https://my.novaposhta.ua/orders/"+method+"/"+parts+"/type/"+(type||"pdf")+"/apiKey/"+window.NP_API_KEY;
  },
  printMarking100x100URL(refs){return NP._printURL("printMarking100x100",refs,"pdf");},
  printScanSheetURL(scanSheetRef){return NP._printURL("printScanSheet",[scanSheetRef],"pdf");},
  printDocumentURL(refs){return NP._printURL("printDocument",refs,"pdf");}
};

// ─── Toast system ────────────────────────────────────────────────────────────
let toastSetter=null;
function toast(message,type="info"){
  if(!toastSetter)return;
  const id=Math.random().toString(36).slice(2);
  toastSetter(list=>[...list,{id,message,type}]);
  setTimeout(()=>toastSetter(list=>list.filter(t=>t.id!==id)),3500);
}
function ToastHost(){
  const[list,setList]=useState([]);
  toastSetter=setList;
  return <div className="toast-wrap">{list.map(t=><div key={t.id} className={"toast "+t.type}><Icon name={t.type==="success"?"check":(t.type==="error"?"alert":"info")} size={16}/>{t.message}</div>)}</div>;
}

// ─── Modal primitive ─────────────────────────────────────────────────────────
function Modal({open,onClose,title,children,footer,size}){
  if(!open)return null;
  return <div className="modal-backdrop" onClick={onClose}>
    <div className={"modal "+(size==="lg"?"modal-lg":(size==="xl"?"modal-xl":""))} onClick={e=>e.stopPropagation()}>
      <div className="modal-header">
        <div className="modal-title">{title}</div>
        <button className="modal-close" onClick={onClose}><Icon name="x" size={18}/></button>
      </div>
      <div className="modal-body">{children}</div>
      {footer&&<div className="modal-footer">{footer}</div>}
    </div>
  </div>;
}

// ─── Confirm dialog ──────────────────────────────────────────────────────────
let confirmSetter=null;
function confirmDialog(message,opts){
  return new Promise(resolve=>{
    if(!confirmSetter){resolve(window.confirm(message));return;}
    confirmSetter({open:true,message,...opts||{},resolve});
  });
}
function ConfirmHost(){
  const[state,setState]=useState({open:false,message:""});
  confirmSetter=setState;
  const close=v=>{if(state.resolve)state.resolve(v);setState({open:false,message:""});};
  if(!state.open)return null;
  return <Modal open={true} onClose={()=>close(false)} title={state.title||"Підтвердити дію"} footer={
    <>
      <button className="btn btn-secondary" onClick={()=>close(false)}>Скасувати</button>
      <button className={"btn "+(state.danger?"btn-danger":"btn-primary")} onClick={()=>close(true)}>{state.okLabel||"Підтвердити"}</button>
    </>
  }>{state.message}</Modal>;
}

// ─── Login page ──────────────────────────────────────────────────────────────
function LoginPage({onLogin}){
  const[login,setLogin]=useState("");
  const[pwd,setPwd]=useState("");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);
  const submit=async e=>{
    e.preventDefault();
    setErr("");setLoading(true);
    if(!supabase){setErr("Немає з'єднання з базою");setLoading(false);return;}
    const{data,error}=await supabase.from("app_users").select("*").eq("login",login.trim()).eq("password",pwd).maybeSingle();
    setLoading(false);
    if(error||!data){setErr("Невірний логін або пароль");return;}
    LS.set("user",{login:data.login,name:data.name,role:data.role});
    onLogin({login:data.login,name:data.name,role:data.role});
  };
  return <div className="login-screen">
    <form className="login-card" onSubmit={submit}>
      <div className="login-logo">
        <div className="login-logo-mark">L</div>
        <div className="login-title">Love Your Haire</div>
        <div className="login-sub">CRM v2 · Вхід</div>
      </div>
      <div className="field">
        <label className="label">Логін</label>
        <input className="input" value={login} onChange={e=>setLogin(e.target.value)} autoFocus required/>
      </div>
      <div className="field">
        <label className="label">Пароль</label>
        <input className="input" type="password" value={pwd} onChange={e=>setPwd(e.target.value)} required/>
      </div>
      {err&&<div style={{color:"var(--red)",fontSize:12,marginBottom:12}}>{err}</div>}
      <button className="btn btn-primary w-full" disabled={loading} style={{justifyContent:"center"}}>
        {loading?<span className="spinner"/>:<><Icon name="check" size={16}/>Увійти</>}
      </button>
      <div style={{textAlign:"center",fontSize:11,color:"var(--text-3)",marginTop:14}}>
        v1 доступна за адресою <a href="/" style={{color:"var(--pink)"}}>/</a>
      </div>
    </form>
  </div>;
}

// ─── App shell ───────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(()=>LS.get("user"));
  const[page,setPage]=useState(()=>LS.get("page")||(user?.role==="manager"?"orders":"dashboard"));
  const[orders,setOrders]=useState([]);
  const[products,setProducts]=useState([]);
  const[clients,setClients]=useState([]);
  const[expenses,setExpenses]=useState([]);
  const[payments,setPayments]=useState([]);
  const[booting,setBooting]=useState(true);

  const isMgr=user?.role==="manager";

  // Set page when user role changes
  useEffect(()=>{LS.set("page",page);},[page]);

  // Initial load
  useEffect(()=>{
    if(!user)return;
    (async()=>{
      setBooting(true);
      try{
        const[o,p,c,e,wfp]=await Promise.all([
          DB.loadAll("orders"),
          DB.loadAll("products"),
          DB.loadAll("clients"),
          DB.loadAll("expenses"),
          supabase?supabase.from("wfp_payments").select("*").order("received_at",{ascending:false}).limit(500).then(r=>r.data||[]):Promise.resolve([])
        ]);
        if(o)setOrders(o.map(mapOrderFromDB).sort((a,b)=>new Date(b.date)-new Date(a.date)));
        if(p)setProducts(p);
        if(c)setClients(c.map(mapClientFromDB));
        if(e)setExpenses(e);
        if(wfp)setPayments(wfp);
      }catch(err){console.error(err);toast("Помилка завантаження","error");}
      finally{setBooting(false);}
    })();
  },[user]);

  // Realtime subscriptions
  useEffect(()=>{
    if(!user||!supabase)return;
    const channels=[];
    const ordersCh=supabase.channel("v2_orders").on("postgres_changes",{event:"*",schema:"public",table:"orders"},payload=>{
      if(payload.eventType==="DELETE"){
        setOrders(o=>o.filter(x=>x.id!==payload.old.id));
      }else{
        const row=mapOrderFromDB(payload.new);
        setOrders(o=>{
          const idx=o.findIndex(x=>x.id===row.id);
          if(idx>=0){const copy=[...o];copy[idx]=row;return copy;}
          return[row,...o].sort((a,b)=>new Date(b.date)-new Date(a.date));
        });
      }
    }).subscribe();
    channels.push(ordersCh);
    return()=>channels.forEach(c=>{try{c.unsubscribe();}catch{}});
  },[user]);

  const updateOrder=useCallback(async(id,patch,opts)=>{
    const old=orders.find(o=>o.id===id);
    if(!old)return;
    const next={...old,...patch};
    setOrders(arr=>arr.map(o=>o.id===id?next:o));
    await DB.upsert("orders",mapOrderToDB(next));
    if(opts?.audit){
      DB.logAction(id,user,opts.audit.action,opts.audit.before||old,opts.audit.after||patch,opts.audit.note);
    }
  },[orders,user]);

  const addOrder=useCallback(async(o)=>{
    const row={...o,id:o.id||Date.now()};
    setOrders(arr=>[row,...arr]);
    await DB.upsert("orders",mapOrderToDB(row));
    DB.logAction(row.id,user,"create",null,{client:row.client,total:row.total},null);
    return row;
  },[user]);

  const removeOrder=useCallback(async(id)=>{
    setOrders(arr=>arr.filter(o=>o.id!==id));
    await DB.remove("orders",id);
    DB.logAction(id,user,"delete",null,null,null);
  },[user]);

  const logout=()=>{LS.del("user");setUser(null);};

  if(!user)return<><LoginPage onLogin={setUser}/><ToastHost/><ConfirmHost/></>;

  const visibleNav=NAV_ALL.filter(n=>!n.adminOnly||!isMgr);
  const currentNav=visibleNav.find(n=>n.key===page)||visibleNav[0];

  const ctx={orders,products,clients,expenses,payments,user,isMgr,updateOrder,addOrder,removeOrder};

  const renderPage=()=>{
    switch(page){
      case"dashboard":return<DashboardPage {...ctx}/>;
      case"orders":return<OrdersListPage {...ctx} setPage={setPage}/>;
      case"neworder":return<NewOrderPage {...ctx} setPage={setPage}/>;
      case"clients":return<ClientsPage {...ctx}/>;
      case"chat":return<ChatPage {...ctx}/>;
      case"products":return<ProductsPage {...ctx} setProducts={setProducts}/>;
      case"expenses":return<ExpensesPage {...ctx} setExpenses={setExpenses}/>;
      case"payments":return<PaymentsPage {...ctx}/>;
      case"bulk":return<BulkImportPage {...ctx}/>;
      default:return<div className="card">Сторінка не знайдена</div>;
    }
  };

  return<>
    <div className="app">
      <aside className="sidebar">
        <div className="sidebar-logo">
          <div className="sidebar-logo-title">Love Your Haire</div>
          <div className="sidebar-logo-sub">CRM v2</div>
        </div>
        {visibleNav.map(n=>
          <div key={n.key} className={"nav-item "+(page===n.key?"active":"")} onClick={()=>setPage(n.key)}>
            <Icon name={n.icon} size={16}/>
            {n.label}
          </div>
        )}
        <div className="sidebar-user">
          <div className="user-avatar">{(user.name||user.login||"?")[0].toUpperCase()}</div>
          <div className="user-meta">
            <div className="user-name">{user.name||user.login}</div>
            <div className="user-role">{isMgr?"Менеджер":"Адмін"}</div>
          </div>
          <button className="user-logout" onClick={logout} title="Вийти"><Icon name="logout" size={16}/></button>
        </div>
      </aside>
      <main className="main">
        <div className="topbar">
          <div className="topbar-title">{currentNav.label}</div>
          <div className="topbar-actions">
            {/* page-specific actions injected by page */}
          </div>
        </div>
        <div className="page">
          {booting?<div className="empty"><span className="spinner"/></div>:renderPage()}
        </div>
      </main>
    </div>
    <nav className="mobile-nav">
      {visibleNav.slice(0,5).map(n=>
        <div key={n.key} className={"mobile-nav-item "+(page===n.key?"active":"")} onClick={()=>setPage(n.key)}>
          <Icon name={n.icon} size={18}/>
          <span>{n.label.split(" ")[0]}</span>
        </div>
      )}
    </nav>
    <ToastHost/>
    <ConfirmHost/>
  </>;
}

// ─── DashboardPage v2 — clean summary ───────────────────────────────────────
function DashboardPage({orders,products,expenses,payments,isMgr}){
  const[range,setRange]=useState(()=>LS.get("dash_range")||"30d");
  useEffect(()=>LS.set("dash_range",range),[range]);

  const{from,to}=useMemo(()=>{
    const now=new Date();
    const to=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59);
    const from=new Date(to);
    if(range==="7d")from.setDate(from.getDate()-6);
    else if(range==="30d")from.setDate(from.getDate()-29);
    else if(range==="90d")from.setDate(from.getDate()-89);
    else if(range==="ytd")from.setMonth(0,1);
    from.setHours(0,0,0,0);
    return{from,to};
  },[range]);

  const inRange=useMemo(()=>orders.filter(o=>{
    const d=new Date(o.date);return d>=from&&d<=to;
  }),[orders,from,to]);

  const successful=inRange.filter(o=>["received","delivered","atPost","shipped","toSend"].includes(o.status));

  const totalRev=successful.reduce((s,o)=>s+(o.total||0),0);
  const totalCost=successful.reduce((s,o)=>s+(o.totalCost||0),0);
  const periodExpenses=expenses.filter(e=>{const d=new Date(e.date);return d>=from&&d<=to;}).reduce((s,e)=>s+Number(e.amount||0),0);
  const profit=totalRev-totalCost-periodExpenses;
  const avgCheck=successful.length?Math.round(totalRev/successful.length):0;

  // ─── Previous period for delta ───
  const prevSpan=to-from;
  const prevFrom=new Date(from-prevSpan-86400000);
  const prevTo=new Date(from-86400000);
  const prevRev=orders.filter(o=>{const d=new Date(o.date);return d>=prevFrom&&d<=prevTo&&["received","delivered","atPost","shipped","toSend"].includes(o.status);}).reduce((s,o)=>s+(o.total||0),0);
  const revDelta=prevRev>0?Math.round((totalRev-prevRev)/prevRev*100):0;

  // ─── Top products ───
  const prodMap={};
  successful.forEach(o=>(o.items||[]).forEach(it=>{
    if(!prodMap[it.name])prodMap[it.name]={name:it.name,qty:0,sum:0};
    prodMap[it.name].qty+=Number(it.qty||1);
    prodMap[it.name].sum+=Number(it.price||0)*Number(it.qty||1);
  }));
  const topProducts=Object.values(prodMap).sort((a,b)=>b.sum-a.sum).slice(0,5);
  const maxProdSum=topProducts[0]?.sum||1;

  // ─── Status funnel ───
  const statusCounts={};
  inRange.forEach(o=>{statusCounts[o.status]=(statusCounts[o.status]||0)+1;});
  const funnelStatuses=[
    {key:"new",color:"var(--pink)",label:"Нові"},
    {key:"ttn",color:"var(--amber)",label:"Потрібна ТТН"},
    {key:"toSend",color:"var(--blue)",label:"На відправку"},
    {key:"shipped",color:"#5da3e3",label:"Відправлено"},
    {key:"atPost",color:"#b07e0c",label:"На пошті"},
    {key:"received",color:"var(--green)",label:"Отримано"},
    {key:"refused",color:"var(--red)",label:"Відмова"}
  ];
  const totalForDonut=funnelStatuses.reduce((s,f)=>s+(statusCounts[f.key]||0),0)||1;

  // ─── Daily revenue (only if range > 7 days) ───
  const showDaily=range!=="7d";
  const dailyRev=useMemo(()=>{
    if(!showDaily)return[];
    const m={};
    successful.forEach(o=>{
      const k=new Date(o.date).toISOString().slice(0,10);
      m[k]=(m[k]||0)+(o.total||0);
    });
    const arr=[];
    const cur=new Date(from);
    while(cur<=to){
      const k=cur.toISOString().slice(0,10);
      arr.push({date:new Date(cur),sum:m[k]||0});
      cur.setDate(cur.getDate()+1);
    }
    return arr;
  },[successful,from,to,showDaily]);
  const maxDay=Math.max(1,...dailyRev.map(d=>d.sum));

  // ─── Expenses by category ───
  const expByCat={};
  expenses.filter(e=>{const d=new Date(e.date);return d>=from&&d<=to;}).forEach(e=>{
    expByCat[e.category]=(expByCat[e.category]||0)+Number(e.amount||0);
  });
  const expCatArr=Object.entries(expByCat).map(([k,v])=>({cat:k,sum:v})).sort((a,b)=>b.sum-a.sum);
  const maxExpCat=expCatArr[0]?.sum||1;

  // ─── Attention widget ───
  const now=Date.now();
  const D2=2*24*60*60*1000;
  const D5=5*24*60*60*1000;
  const attention={
    needsTtn:orders.filter(o=>o.status==="ttn"&&(now-new Date(o.date).getTime())>D2).length,
    stuckAtPost:orders.filter(o=>o.status==="atPost"&&(now-new Date(o.date).getTime())>D5).length,
    unmatchedPayments:payments.filter(p=>!p.matched_order_id&&p.transaction_status==="Approved").length,
    lowStock:products.filter(p=>p.type==="product"&&p.stock!=null&&p.stock<=3&&p.stock>=0).length
  };
  const attentionTotal=attention.needsTtn+attention.stuckAtPost+attention.unmatchedPayments+attention.lowStock;

  return<div className="col gap-16">
    {/* Header — range picker */}
    <div className="row" style={{gap:8,flexWrap:"wrap"}}>
      <div className="row gap-8" style={{flex:1}}>
        <div className="text-sm muted fw-600">Період:</div>
        {[
          {k:"7d",l:"7 днів"},
          {k:"30d",l:"30 днів"},
          {k:"90d",l:"90 днів"},
          {k:"ytd",l:"З початку року"}
        ].map(r=><button key={r.k} className={"pill "+(range===r.k?"active":"")} onClick={()=>setRange(r.k)}>{r.l}</button>)}
      </div>
      <div className="muted text-sm">{fmtD(from)} — {fmtD(to)}</div>
    </div>

    {/* KPI row */}
    <div className="grid grid-4">
      <div className="kpi" style={{"--accent":"var(--pink)"}}>
        <div className="kpi-label">Виручка</div>
        <div className="kpi-value">{fmt(totalRev)}
          {revDelta!==0&&<span className={"kpi-delta "+(revDelta>0?"up":"down")}>{revDelta>0?"↑":"↓"}{Math.abs(revDelta)}%</span>}
        </div>
        <div className="kpi-sub">{successful.length} успішних</div>
      </div>
      <div className="kpi" style={{"--accent":"var(--green)"}}>
        <div className="kpi-label">Чистий прибуток</div>
        <div className="kpi-value">{fmt(profit)}</div>
        <div className="kpi-sub">−собівартість, −витрати</div>
      </div>
      <div className="kpi" style={{"--accent":"var(--blue)"}}>
        <div className="kpi-label">Середній чек</div>
        <div className="kpi-value">{fmt(avgCheck)}</div>
        <div className="kpi-sub">по успішних</div>
      </div>
      <div className="kpi" style={{"--accent":"var(--amber)"}}>
        <div className="kpi-label">Витрати</div>
        <div className="kpi-value">{fmt(periodExpenses)}</div>
        <div className="kpi-sub">{Object.keys(expByCat).length} категорій</div>
      </div>
    </div>

    {/* Attention widget — only if anything */}
    {attentionTotal>0&&<div className="card" style={{borderColor:"var(--amber)",background:"#fffbf2"}}>
      <div className="card-header">
        <Icon name="alert" size={18} className=""/>
        <div className="card-title">Потребує уваги</div>
        <div className="badge badge-amber">{attentionTotal}</div>
      </div>
      <div className="grid grid-4">
        {attention.needsTtn>0&&<div className="row gap-8"><span className="badge badge-amber">{attention.needsTtn}</span><span className="text-sm">ТТН не створено &gt;2 днів</span></div>}
        {attention.stuckAtPost>0&&<div className="row gap-8"><span className="badge badge-amber">{attention.stuckAtPost}</span><span className="text-sm">На пошті &gt;5 днів (ризик повернення)</span></div>}
        {attention.unmatchedPayments>0&&<div className="row gap-8"><span className="badge badge-blue">{attention.unmatchedPayments}</span><span className="text-sm">Платежі без замовлення</span></div>}
        {attention.lowStock>0&&<div className="row gap-8"><span className="badge badge-red">{attention.lowStock}</span><span className="text-sm">Залишок ≤3 шт</span></div>}
      </div>
    </div>}

    {/* 2-col: Top products + Status funnel */}
    <div className="grid grid-2">
      <div className="card">
        <div className="card-header">
          <Icon name="star" size={18}/>
          <div className="card-title">Топ товарів</div>
        </div>
        {topProducts.length===0?<div className="empty"><span className="muted">За цей період продажів немає</span></div>:
          <div className="col gap-8">
            {topProducts.map(p=>
              <div key={p.name} className="col gap-4">
                <div className="row" style={{justifyContent:"space-between",fontSize:13}}>
                  <span className="fw-600 truncate" title={p.name} style={{maxWidth:"60%"}}>{p.name}</span>
                  <span className="muted">{p.qty} шт · <span className="fw-700">{fmt(p.sum)}</span></span>
                </div>
                <div style={{height:6,background:"var(--surface-2)",borderRadius:3,overflow:"hidden"}}>
                  <div style={{height:"100%",width:Math.max(2,(p.sum/maxProdSum)*100)+"%",background:"linear-gradient(90deg,var(--pink),var(--pink-2))",borderRadius:3}}/>
                </div>
              </div>
            )}
          </div>
        }
      </div>

      <div className="card">
        <div className="card-header">
          <Icon name="chart" size={18}/>
          <div className="card-title">Статус замовлень</div>
        </div>
        <div className="row gap-16" style={{alignItems:"center"}}>
          <DonutChart segments={funnelStatuses.map(s=>({value:statusCounts[s.key]||0,color:s.color,label:s.label})).filter(s=>s.value>0)} totalLabel={inRange.length} totalSub="заказів"/>
          <div className="col gap-6 flex-1">
            {funnelStatuses.map(s=>{const c=statusCounts[s.key]||0;return<div key={s.key} className="row gap-8" style={{fontSize:12}}>
              <div style={{width:10,height:10,borderRadius:2,background:s.color}}/>
              <span className="flex-1">{s.label}</span>
              <span className="fw-700">{c}</span>
              <span className="muted-2">{Math.round((c/totalForDonut)*100)}%</span>
            </div>;})}
          </div>
        </div>
      </div>
    </div>

    {/* Daily revenue chart — only when range > 7d */}
    {showDaily&&dailyRev.length>0&&<div className="card">
      <div className="card-header">
        <Icon name="chart" size={18}/>
        <div className="card-title">Виручка по днях</div>
      </div>
      <div style={{display:"flex",alignItems:"flex-end",gap:2,height:120,paddingTop:8}}>
        {dailyRev.map((d,i)=>{
          const h=d.sum>0?Math.max(2,(d.sum/maxDay)*100):1;
          return<div key={i} title={fmtD(d.date)+": "+fmt(d.sum)} style={{flex:1,minWidth:0,height:h+"%",background:d.sum>0?"var(--pink)":"var(--border)",borderRadius:"2px 2px 0 0",transition:"all .2s",cursor:"pointer"}}/>;
        })}
      </div>
      <div className="row" style={{justifyContent:"space-between",marginTop:8,fontSize:11,color:"var(--text-3)"}}>
        <span>{fmtD(dailyRev[0]?.date)}</span>
        <span>Макс: {fmt(maxDay)}</span>
        <span>{fmtD(dailyRev[dailyRev.length-1]?.date)}</span>
      </div>
    </div>}

    {/* Expenses by category */}
    {expCatArr.length>0&&<div className="card">
      <div className="card-header">
        <Icon name="receipt" size={18}/>
        <div className="card-title">Витрати по категоріях</div>
      </div>
      <div className="col gap-8">
        {expCatArr.map(c=>
          <div key={c.cat} className="col gap-4">
            <div className="row" style={{justifyContent:"space-between",fontSize:13}}>
              <span className="fw-600">{c.cat}</span>
              <span className="fw-700">{fmt(c.sum)}</span>
            </div>
            <div style={{height:6,background:"var(--surface-2)",borderRadius:3,overflow:"hidden"}}>
              <div style={{height:"100%",width:Math.max(2,(c.sum/maxExpCat)*100)+"%",background:"var(--amber)",borderRadius:3}}/>
            </div>
          </div>
        )}
      </div>
    </div>}
  </div>;
}

function DonutChart({segments,totalLabel,totalSub}){
  const r=68,cx=80,cy=80,c=2*Math.PI*r;
  const total=segments.reduce((s,x)=>s+x.value,0)||1;
  let off=0;
  return<div className="donut-wrap">
    <svg width="160" height="160" viewBox="0 0 160 160" style={{transform:"rotate(-90deg)"}}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--surface-2)" strokeWidth="20"/>
      {segments.map((s,i)=>{
        const len=(s.value/total)*c;
        const dash=`${len} ${c-len}`;
        const el=<circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth="20" strokeDasharray={dash} strokeDashoffset={-off}/>;
        off+=len;
        return el;
      })}
    </svg>
    <div className="donut-label">
      <div className="donut-label-value">{totalLabel}</div>
      <div className="donut-label-sub">{totalSub}</div>
    </div>
  </div>;
}


// ─── NP City / Warehouse pickers (shared) ────────────────────────────────────
function NPCityPicker({value,onChange,placeholder}){
  const[q,setQ]=useState(value||"");
  const[items,setItems]=useState([]);
  const[open,setOpen]=useState(false);
  const[loading,setLoading]=useState(false);
  useEffect(()=>setQ(value||""),[value]);
  useEffect(()=>{
    if(!q||q.length<2){setItems([]);return;}
    const t=setTimeout(async()=>{
      setLoading(true);
      const r=await NP.searchCity(q);
      setItems(r);setLoading(false);
    },300);
    return()=>clearTimeout(t);
  },[q]);
  return<div style={{position:"relative"}}>
    <input className="input" value={q} placeholder={placeholder||"Місто"}
      onChange={e=>{setQ(e.target.value);setOpen(true);onChange?.({name:e.target.value,ref:""});}}
      onFocus={()=>setOpen(true)}
      onBlur={()=>setTimeout(()=>setOpen(false),200)}/>
    {open&&items.length>0&&<div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:"#fff",border:"1px solid var(--border-strong)",borderRadius:8,maxHeight:240,overflowY:"auto",zIndex:50,boxShadow:"var(--shadow-md)"}}>
      {items.map(it=><div key={it.ref} style={{padding:"8px 12px",cursor:"pointer",fontSize:13,borderBottom:"1px solid var(--border)"}} onMouseDown={()=>{setQ(it.name);setOpen(false);onChange?.({name:it.name,ref:it.ref,area:it.area});}}>
        <div className="fw-600">{it.name}</div>
        {it.area&&<div className="muted-2 text-sm">{it.area}</div>}
      </div>)}
    </div>}
    {loading&&<div style={{position:"absolute",right:10,top:9}}><span className="spinner" style={{width:14,height:14}}/></div>}

}

// ─── Bulk TTN Telegram message ───────────────────────────────────────────────
async function sendBulkTtnToTelegram(orders,user){
  const now=new Date();
  const dateStr=now.toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit"});
  const timeStr=now.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
  const totalSum=orders.reduce((s,o)=>s+(o.total||0),0);
  const codSum=orders.reduce((s,o)=>s+(o.payment==="control"?(o.codAmount||o.total||0):0),0);

  const lines=[
    `<b>📦 Партія ТТН — ${dateStr} ${timeStr}</b>`,
    `<i>Створив: ${user?.name||user?.login||"система"}</i>`,
    "",
    ...orders.map((o,i)=>{
      const npb=o.npBranch||"—";
      const items=(o.items||[]).map(it=>`${it.name} ×${it.qty||1}`).join(", ");
      return `${i+1}. <b>${o.client}</b> — <code>${o.ttn}</code>\n   📍 ${o.city||"?"} №${npb} · ${o.items?.length||0} тов. · ${o.total||0}₴`;
    }),
    "",
    `<b>Разом:</b> ${orders.length} замовлень · ${totalSum}₴`,
    codSum>0?`<b>Контроль оплати:</b> ${codSum}₴`:""
  ].filter(Boolean);
  await tgSendAdmin(lines.join("\n"));

  // Send marking PDFs as document links
  for(const o of orders){
    if(!o.ttn)continue;
    await tgSendAdminDoc(NP.markingURL(o.ttn),`Маркування ${o.ttn} — ${o.client}`);
  }
}

function RedirectModal({order,onClose,onSave,user}){
  const[city,setCity]=useState({name:order.redirectToCity||"",ref:""});
  const[wh,setWh]=useState({number:order.redirectToBranch||"",ref:"",text:order.redirectToBranch?"№"+order.redirectToBranch:""});
  const[reason,setReason]=useState(order.redirectReason||"");
  const[useNP,setUseNP]=useState(!!order.ttn);  // call NP API only if TTN already exists
  const[saving,setSaving]=useState(false);
  const save=async()=>{
    if(!city.name||!wh.number){toast("Заповніть місто та відділення","warn");return;}
    setSaving(true);
    if(useNP&&order.ttn){
      const r=await NP.changeAddress({ttn:order.ttn,newRecipientCityRef:city.ref,newRecipientWarehouseRef:wh.ref,reason});
      if(!r.ok){toast("НП не дозволила: "+(r.errors?.[0]||"невідомо"),"error");setSaving(false);return;}
      toast("Переадресовано в НП","success");
    }
    await onSave({
      redirectToCity:city.name,redirectToBranch:wh.number,redirectedAt:new Date().toISOString(),redirectReason:reason
    },{action:"redirect",before:{city:order.city,npBranch:order.npBranch},after:{city:city.name,npBranch:wh.number},note:reason});
    setSaving(false);
    onClose();
  };
  return<Modal open={true} onClose={onClose} title="Змінити адресу доставки" footer={
    <><button className="btn btn-secondary" onClick={onClose}>Скасувати</button><button className="btn btn-primary" onClick={save} disabled={saving}>{saving?<span className="spinner"/>:"Зберегти"}</button></>
  }>
    <div className="muted text-sm">Поточна: <b>{order.city||"—"}, №{order.npBranch||"—"}</b></div>
    <div className="field"><label className="label">Нове місто</label><NPCityPicker value={city.name} onChange={setCity}/></div>
    <div className="field"><label className="label">Нове відділення</label><NPWarehousePicker cityRef={city.ref} value={wh.text||wh.number} onChange={setWh}/></div>
    <div className="field"><label className="label">Причина</label><textarea className="textarea" rows={2} value={reason} onChange={e=>setReason(e.target.value)} placeholder="Напр.: клієнт переїхав, помилка адреси"/></div>
    {order.ttn&&<label className="row gap-8 text-sm"><input type="checkbox" checked={useNP} onChange={e=>setUseNP(e.target.checked)}/>Викликати НП API (orderRedirecting) — змінити дані в накладній</label>}
    {!order.ttn&&<div className="muted text-sm">ТТН ще не створена — оновимо тільки дані замовлення.</div>}
  </Modal>;
}

function CodChangeModal({order,onClose,onSave,user}){
  const[amount,setAmount]=useState(order.codAmount!=null?String(order.codAmount):String(order.total||0));
  const[reason,setReason]=useState("");
  const[saving,setSaving]=useState(false);
  const save=async()=>{
    const newAmt=Number(amount);
    if(isNaN(newAmt)||newAmt<0){toast("Невірна сума","warn");return;}
    setSaving(true);
    const history=Array.isArray(order.codAmountHistory)?order.codAmountHistory:[];
    history.push({amount:newAmt,prev:order.codAmount,changed_at:new Date().toISOString(),changed_by:user?.login||"",reason});
    await onSave({codAmount:newAmt,codAmountHistory:history},{action:"cod_change",before:{cod:order.codAmount},after:{cod:newAmt},note:reason});
    setSaving(false);
    toast("Контроль оплати оновлено","success");
    onClose();
  };
  const hist=Array.isArray(order.codAmountHistory)?order.codAmountHistory:[];
  return<Modal open={true} onClose={onClose} title="Контроль оплати" footer={
    <><button className="btn btn-secondary" onClick={onClose}>Скасувати</button><button className="btn btn-primary" onClick={save} disabled={saving}>{saving?<span className="spinner"/>:"Зберегти"}</button></>
  }>
    <div className="muted text-sm">Поточна сума: <b>{fmt(order.codAmount||0)}</b> · Загальна сума заказу: {fmt(order.total)}</div>
    <div className="field"><label className="label">Нова сума контролю оплати</label><input className="input" type="number" value={amount} onChange={e=>setAmount(e.target.value)}/></div>
    <div className="field"><label className="label">Причина зміни</label><textarea className="textarea" rows={2} value={reason} onChange={e=>setReason(e.target.value)} placeholder="Напр.: знижка, додано товар"/></div>
    {hist.length>0&&<div>
      <div className="text-sm fw-600 mb-8">Історія змін:</div>
      <div className="col gap-4">{hist.slice().reverse().slice(0,5).map((h,i)=>
        <div key={i} className="audit-entry action-cod_change">
          <span>{h.prev!=null?fmt(h.prev):"—"} → <b>{fmt(h.amount)}</b></span>
          <span>{h.reason}</span>
          <span className="audit-time">{fmtDT(h.changed_at)}</span>
        </div>
      )}</div>
    </div>}
  </Modal>;
}

function ReturnModal({order,onClose,onSave,user}){
  const[reason,setReason]=useState("");
  const[useNP,setUseNP]=useState(!!order.ttn);
  const[saving,setSaving]=useState(false);
  const save=async()=>{
    if(!reason){toast("Вкажіть причину повернення","warn");return;}
    setSaving(true);
    let returnTtn="";
    if(useNP&&order.ttn){
      const r=await NP.createReturnTTN({ttn:order.ttn,reason});
      if(!r.ok){toast("НП повернення: "+(r.errors?.[0]||"невідомо"),"error");setSaving(false);return;}
      returnTtn=r.number;
      toast("Повернення оформлено в НП","success");
    }
    await onSave({
      status:"returning",returnedAt:new Date().toISOString(),returnReason:reason,returnTtn
    },{action:"return",before:{status:order.status},after:{status:"returning"},note:reason});
    setSaving(false);
    onClose();
  };
  return<Modal open={true} onClose={onClose} title="Оформити повернення" footer={
    <><button className="btn btn-secondary" onClick={onClose}>Скасувати</button><button className="btn btn-danger" onClick={save} disabled={saving}>{saving?<span className="spinner"/>:"Підтвердити повернення"}</button></>
  }>
    <div className="field"><label className="label">Причина повернення</label><textarea className="textarea" rows={3} value={reason} onChange={e=>setReason(e.target.value)} placeholder="Не забрав, відмова, пошкоджено…"/></div>
    {order.ttn&&<label className="row gap-8 text-sm"><input type="checkbox" checked={useNP} onChange={e=>setUseNP(e.target.checked)}/>Викликати НП (orderCargoReturn) — створити зворотну ТТН</label>}
    <div className="muted text-sm">Статус замовлення буде змінено на «Повертається».</div>
  </Modal>;
}

function AuditLogModal({orderId,onClose}){

function OrdersListPage({orders,products,user,isMgr,updateOrder,removeOrder,setPage}){
  const[filter,setFilter]=useState(()=>LS.get("orders_filter")||(isMgr?"new":"all"));
  const[search,setSearch]=useState("");
  const[editing,setEditing]=useState(null);
  const[selected,setSelected]=useState(new Set());
  const[bulkRunning,setBulkRunning]=useState(false);
  useEffect(()=>LS.set("orders_filter",filter),[filter]);

  const counts=useMemo(()=>{
    const c={all:orders.length};
    orders.forEach(o=>{c[o.status]=(c[o.status]||0)+1;});
    return c;
  },[orders]);

  // Filter pills
  const visibleFilters=[
    {k:"all",label:"Усі"},
    {k:"new",label:"Нові"},
    {k:"ttn",label:"Потрібна ТТН"},
    {k:"toSend",label:"На відправку"},
    {k:"shipped",label:"Відправлено"},
    {k:"atPost",label:"На пошті"},
    ...(isMgr?[]:[{k:"received",label:"Отримано"},{k:"refused",label:"Відмова"},{k:"studio",label:"Студія"},{k:"returning",label:"Повертається"}])
  ];

  const filtered=useMemo(()=>{
    let arr=orders;
    if(filter!=="all")arr=arr.filter(o=>o.status===filter);
    if(search){
      const q=search.toLowerCase();
      arr=arr.filter(o=>(o.client||"").toLowerCase().includes(q)||normPhone(o.phone).includes(normPhone(search))||(o.ttn||"").includes(search)||(o.city||"").toLowerCase().includes(q));
    }
    return arr;
  },[orders,filter,search]);

  // Bulk-TTN readiness check (≥5 orders in "ttn" status with all required fields)
  const ttnReady=useMemo(()=>orders.filter(o=>o.status==="ttn"&&o.deliveryType==="np"&&!o.ttn&&o.client&&o.phone&&o.city&&o.npBranch),[orders]);
  const showBulkBanner=ttnReady.length>=5;

  const handleBulkTtn=async()=>{
    if(!ttnReady.length)return;
    if(!await confirmDialog(`Створити ${ttnReady.length} ТТН та відправити в Telegram?`,{okLabel:"Створити"}))return;
    setBulkRunning(true);
    try{
      const sender=await NP.getSenderInfo();
      if(!sender||!sender.contact||!sender.address){toast("Не вдалося отримати дані відправника НП","error");setBulkRunning(false);return;}
      const created=[];const refsForScan=[];let failedCount=0;const errors=[];
      for(const o of ttnReady){
        try{
          const cities=await NP.searchCity(o.city);
          const city=cities[0];
          if(!city){failedCount++;errors.push(`${o.client}: місто не знайдено (${o.city})`);continue;}
          const whs=await NP.getWarehouses(city.ref);
          const wh=whs.find(w=>String(w.num)===String(o.npBranch));
          if(!wh){failedCount++;errors.push(`${o.client}: №${o.npBranch} не знайдено`);continue;}
          const rec=await NP.createRecipient(o.client,o.phone,city.ref);
          if(!rec.ok){failedCount++;errors.push(`${o.client}: ${(rec.errors||[]).join(", ")}`);continue;}
          const desc=(o.items||[]).map(it=>it.name).filter(Boolean).slice(0,3).join(", ")||"Товари";
          const cargoRef=await NP.getCargoDescriptionRef("одяг");
          const today=new Date();
          const dStr=String(today.getDate()).padStart(2,"0")+"."+String(today.getMonth()+1).padStart(2,"0")+"."+today.getFullYear();
          const cost=Math.max(100,Math.round(o.total||300));
          const codAmount=o.payment==="control"?(o.codAmount||o.total||0):0;
          const params={
            PayerType:"Recipient",PaymentMethod:"Cash",DateTime:dStr,CargoType:"Parcel",Weight:"0.5",
            ServiceType:"WarehouseWarehouse",SeatsAmount:"1",Description:desc,Cost:String(cost),
            CitySender:sender.address.cityRef,Sender:sender.ref,
            SenderAddress:sender.address.ref,ContactSender:sender.contact.ref,
            SendersPhone:sender.contact.phone||"0",
            CityRecipient:city.ref,Recipient:rec.ref,RecipientAddress:wh.ref,
            ContactRecipient:rec.contactRef,RecipientsPhone:normPhoneNP(o.phone)
          };
          if(cargoRef)params.CargoDescription=cargoRef;
          if(codAmount>0)params.BackwardDeliveryData=[{PayerType:"Recipient",CargoType:"Money",RedeliveryString:String(codAmount)}];
          const r=await NP.createTTN(params);
          if(r.ok&&r.ttn){
            await updateOrder(o.id,{ttn:r.ttn,status:"toSend"},{audit:{action:"ttn_create",after:{ttn:r.ttn}}});
            created.push({...o,ttn:r.ttn});
            if(r.ref)refsForScan.push(r.ref);
          }else{failedCount++;errors.push(`${o.client}: ${(r.errors||["невідома"]).join(", ")}`);}
        }catch(e){failedCount++;errors.push(`${o.client}: ${e.message}`);}
      }
      if(created.length>0){
        await sendBulkTtnToTelegram(created,user);
        if(refsForScan.length>0){
          try{
            const ss=await NP.createScanSheet(refsForScan);
            const markingURL=NP.printMarking100x100URL(refsForScan);
            await tgSendAdminDoc(markingURL,`Маркування 100×100 — партія ${ss.ok?ss.number:""}`);
            if(ss.ok&&ss.ref)await tgSendAdminDoc(NP.printScanSheetURL(ss.ref),`Реєстр прийому-передачі №${ss.number}`);
          }catch(e){console.warn("scansheet failed",e);}
        }
        toast(`Створено ${created.length} ТТН, надіслано в Telegram`,"success");
      }
      if(failedCount>0){toast(`${failedCount} не створено — див. консоль`,"warn");console.warn("Bulk TTN errors:",errors);}
    }catch(e){console.error(e);toast("Помилка масового створення ТТН","error");}
    finally{setBulkRunning(false);}
  };

  return<div className="col gap-12">
    {/* Bulk TTN banner */}
    {showBulkBanner&&!bulkRunning&&<div className="bulk-banner">
      <div className="bulk-banner-icon"><Icon name="package" size={20}/></div>
      <div className="bulk-banner-text">
        <div className="bulk-banner-title">{ttnReady.length} замовлень готові до відправки</div>
        <div className="bulk-banner-sub">Створити масово ТТН та надіслати партію в Telegram</div>
      </div>
      <button onClick={handleBulkTtn}>📦 Створити {ttnReady.length} ТТН</button>
    </div>}
    {bulkRunning&&<div className="bulk-banner"><div className="bulk-banner-icon"><span className="spinner" style={{borderTopColor:"#fff"}}/></div><div className="bulk-banner-text"><div className="bulk-banner-title">Створюю ТТН…</div><div className="bulk-banner-sub">Не закривай вкладку</div></div></div>}

    {/* Filter bar */}
    <div className="filter-bar">
      <div className="search-input">
        <Icon name="search" size={16}/>
        <input className="input" placeholder="Пошук: клієнт, телефон, ТТН, місто" value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
      {!isMgr&&<button className="btn btn-primary btn-sm" onClick={()=>setPage("neworder")}><Icon name="plus" size={14}/>Нове замовлення</button>}
    </div>

    <div className="row gap-6" style={{flexWrap:"wrap"}}>
      {visibleFilters.map(f=>
        <button key={f.k} className={"pill "+(filter===f.k?"active":"")} onClick={()=>setFilter(f.k)}>
          {f.label}<span className="pill-count">{f.k==="all"?counts.all:(counts[f.k]||0)}</span>
        </button>
      )}
    </div>

    {/* Table (desktop) / Cards (mobile) */}
    {filtered.length===0?
      <div className="card empty"><div className="empty-icon"><Icon name="package" size={20}/></div><div>Заказів не знайдено</div></div>
      :
      <div className="table-wrap" style={{overflowX:"auto"}}>
        <table className="tbl">
          <thead>
            <tr>
              <th style={{width:60}}>#</th>
              <th>Клієнт</th>
              <th>Доставка</th>
              <th>ТТН</th>
              <th>Оплата</th>
              <th style={{textAlign:"right"}}>Сума</th>
              <th>Статус</th>
              <th>Дата</th>
              <th style={{width:50}}></th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(o=>{
              const tg=tgLink(o.phone);
              return<tr key={o.id}>
                <td className="muted-2">#{String(o.id).slice(-4)}</td>
                <td>
                  <div className="fw-700">{o.client||"—"}</div>
                  <div className="muted-2 text-sm row gap-4">{fmtPhone(o.phone)}{tg&&<a href={tg} target="_blank" rel="noopener" title="Telegram">✈</a>}</div>
                </td>
                <td className="text-sm">
                  {o.deliveryType==="studio"?<span className="badge badge-pink">Студія</span>:
                    <>
                      <div>{o.city||"—"}</div>
                      <div className="muted-2 text-sm">№{o.npBranch||"—"}</div>

  const updItem=(i,patch)=>setForm(f=>{const arr=[...f.items];arr[i]={...arr[i],...patch};return{...f,items:arr};});

  const total=form.items.reduce((s,it)=>s+(Number(it.price)||0)*(Number(it.qty)||1),0);
  const totalCost=form.items.reduce((s,it)=>s+(Number(it.cost)||0)*(Number(it.qty)||1),0);

      prepayment:form.prepayment,
      comment:form.comment,
      handledBy:user?.login||""

          <div><label className="label">Телефон</label><input className="input" value={form.phone} onChange={e=>updField("phone",e.target.value)} placeholder="+380…"/></div>
        </div>

          <div><label className="label">Оплата</label><select className="select" value={form.payment} onChange={e=>updField("payment",e.target.value)}><option value="control">Контроль оплати</option><option value="cod">Накладений платіж</option><option value="prepaid">Передоплата</option></select></div>
        </div>

        {form.deliveryType==="np"&&<div className="grid grid-2">
          <div><label className="label">Місто</label><NPCityPicker value={form.city} onChange={c=>setForm(f=>({...f,city:c.name,cityRef:c.ref}))}/></div>
          <div><label className="label">Відділення</label><NPWarehousePicker cityRef={form.cityRef} value={form.npBranch?"№"+form.npBranch:""} onChange={w=>setForm(f=>({...f,npBranch:w.number,branchRef:w.ref}))}/></div>

              <button className="btn-icon" onClick={()=>setForm(f=>({...f,items:f.items.filter((_,j)=>j!==i)}))}><Icon name="x" size={14}/></button>
            </div>
