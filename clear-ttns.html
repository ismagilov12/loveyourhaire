<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Love Your Haire — Масова очистка ТТН (v2)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.33.0/dist/umd/supabase.js"></script>
<style>
body{font-family:-apple-system,Segoe UI,Inter,sans-serif;max-width:760px;margin:32px auto;padding:24px;background:#fef7f9;color:#1a1a1a;line-height:1.5}
h1{margin-top:0;color:#c0668c}
.warn{background:#fff5e0;border-left:4px solid #ea580c;padding:14px 18px;border-radius:10px;margin-bottom:18px;font-size:14px;color:#7c2d12}
#stats{background:#fff;border:1px solid #f0d2db;padding:16px;border-radius:12px;margin-bottom:16px;font-size:15px}
#stats div{margin-bottom:6px}
.btn{padding:13px 24px;border:0;border-radius:10px;font-size:14px;cursor:pointer;font-weight:700;margin-right:10px;margin-bottom:10px;transition:transform 0.05s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-load{background:#c0668c;color:#fff}
.btn-warn{background:#ea580c;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
#actions{display:none;margin-bottom:16px}
#log{background:#1a1a1a;color:#9fefa4;padding:16px;border-radius:10px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;max-height:420px;overflow-y:auto;white-space:pre-wrap;line-height:1.55;margin-top:14px}
</style>
</head>
<body>
<h1>Масова очистка ТТН — v2</h1>
<div class="warn">
<strong>Що робить:</strong>
<ol style="margin:8px 0 0 18px;padding:0">
<li>Підтягує всi заказы з ТТН з Supabase</li>
<li><strong>Питає у Нової Пошти свiжий статус кожної ТТН</strong> (код 2 = Видалена)</li>
<li>Показує розподiл по статусах</li>
<li>Чистить ТТН: ставить маркер ClearedTTNs у localStorage + апдейтить Supabase (ttn=пусто, статус=Новий)</li>
</ol>
</div>
<button class="btn btn-load" id="loadBtn">Завантажити заказы + опитати НП</button>
<div id="stats"></div>
<div id="actions">
  <button class="btn btn-warn" id="clearDeletedBtn">Очистити ТТН з Видалених</button>
  <button class="btn btn-danger" id="clearAllBtn">Очистити ТТН з УСIХ</button>
</div>
<div id="log"></div>
<script>

const SUPABASE_URL = "https://fsihlzzjewhxpogvjapu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzaWhsenpqZXdoeHBvZ3ZqYXB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyOTY2MzUsImV4cCI6MjA5MDg3MjYzNX0._hS7TA8EqIHgz7CH6XxGKuDdOnVBb6u40ntEtZ__MjU";
const NP_KEY = "4299d316a302da241c2b62cd4171765b";
const NP_API = "https://api.novaposhta.ua/v2.0/json/";

let sb = null;
let allWithTtn = [];      // [{id, ttn, ...}]
let trackedStatuses = []; // [{ttn, code, text}]
let deletedOnNP = [];     // orders where fresh NP status code === "2"

function el(id){ return document.getElementById(id); }
function log(msg){ const l = el("log"); l.textContent += msg + "\n"; l.scrollTop = l.scrollHeight; }

function markCleared(orderId, oldTTN){
  try{
    const KEY = "lyh_cleared_ttns";
    const o = JSON.parse(localStorage.getItem(KEY) || "{}");
    o[String(orderId)] = { ts: Date.now(), oldTTN: String(oldTTN || "") };
    localStorage.setItem(KEY, JSON.stringify(o));
  }catch(e){ console.warn("LS fail", e); }
}

async function npCall(model, method, props){
  const r = await fetch(NP_API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ apiKey: NP_KEY, modelName: model, calledMethod: method, methodProperties: props })
  });
  return await r.json();
}

async function trackBatch(ttns){
  const r = await npCall("TrackingDocument", "getStatusDocuments", {
    Documents: ttns.map(t => ({ DocumentNumber: t }))
  });
  if (!r.success || !Array.isArray(r.data)) return [];
  return r.data.map(d => ({
    ttn: String(d.Number || ""),
    code: String(d.StatusCode || ""),
    text: String(d.Status || "")
  })).filter(x => x.ttn);
}

async function load(){
  el("loadBtn").disabled = true;
  el("loadBtn").textContent = "Завантажую...";
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    log("=== Step 1: pull orders with TTN from Supabase ===");
    let from = 0; const pageSize = 1000; let all = [];
    while(true){
      const { data, error } = await sb.from("orders")
        .select("id,client,ttn,status,np_status_code,np_status_text,date,total")
        .neq("ttn", "")
        .not("ttn", "is", null)
        .order("date", { ascending: false })
        .range(from, from + pageSize - 1);
      if(error){ log("ERR " + error.message); break; }
      if(!data || data.length === 0) break;
      all = all.concat(data);
      log("  loaded " + all.length);
      if(data.length < pageSize) break;
      from += pageSize;
    }
    allWithTtn = all.filter(o => o.ttn && String(o.ttn).trim().length > 0);
    log("Total orders with TTN: " + allWithTtn.length);

    log("");
    log("=== Step 2: ask NP for fresh status of each TTN ===");
    trackedStatuses = [];
    const ttns = [...new Set(allWithTtn.map(o => String(o.ttn).trim()))];
    log("Unique TTNs to track: " + ttns.length);
    for (let i = 0; i < ttns.length; i += 100){
      const chunk = ttns.slice(i, i + 100);
      try {
        const rs = await trackBatch(chunk);
        trackedStatuses.push(...rs);
        log("  batch " + (Math.floor(i/100)+1) + ": " + rs.length + " statuses");
      } catch(e){ log("  batch failed: " + e.message); }
    }

    // Build status map and filter deletedOnNP
    const codeByTtn = new Map();
    for (const r of trackedStatuses){ codeByTtn.set(r.ttn, r); }
    deletedOnNP = allWithTtn.filter(o => {
      const r = codeByTtn.get(String(o.ttn).trim());
      return r && (r.code === "2" || /видален/i.test(r.text));
    });

    // Stats by status code
    const byCode = {};
    for (const o of allWithTtn){
      const r = codeByTtn.get(String(o.ttn).trim());
      const k = r ? (r.code + " " + r.text) : "(no NP response)";
      byCode[k] = (byCode[k] || 0) + 1;
    }
    let statsHtml = "<div><strong>" + allWithTtn.length + "</strong> заказiв з ТТН</div>";
    statsHtml += "<div style=\"color:#dc2626\"><strong>" + deletedOnNP.length + "</strong> з них помічені як <strong>Видалена</strong> (свіжий код 2 з НП)</div>";
    statsHtml += "<details style=\"margin-top:10px\"><summary style=\"cursor:pointer;font-size:13px;color:#666\">Розподіл по статусах НП</summary><div style=\"margin-top:8px;font-size:12px;font-family:monospace\">";
    const sortedCodes = Object.keys(byCode).sort((a,b) => byCode[b] - byCode[a]);
    for (const k of sortedCodes){ statsHtml += "<div>" + k + ": " + byCode[k] + "</div>"; }
    statsHtml += "</div></details>";
    el("stats").innerHTML = statsHtml;

    el("actions").style.display = "block";
    el("clearDeletedBtn").textContent = "Очистити ТТН з " + deletedOnNP.length + " Видалених";
    el("clearAllBtn").textContent = "Очистити ТТН з УСІХ " + allWithTtn.length;
    el("clearDeletedBtn").disabled = deletedOnNP.length === 0;
    el("loadBtn").textContent = "Перезавантажити";
    el("loadBtn").disabled = false;
  }catch(e){
    log("EXCEPTION " + e.message);
    el("loadBtn").disabled = false;
    el("loadBtn").textContent = "Спробувати знову";
  }
}

async function clearList(list, label){
  if(!list.length){ alert("Немає що чистити"); return; }
  if(!confirm("Точно очистити ТТН у " + list.length + " заказів (" + label + ")? Дiю не можна скасувати з цього екрану.")) return;
  el("clearDeletedBtn").disabled = true;
  el("clearAllBtn").disabled = true;
  log("");
  log("=== Clearing " + list.length + " orders (" + label + ") ===");
  let ok = 0, fail = 0;
  // Mark all in localStorage FIRST so the main CRM does not restore them via doLoad merge.
  for(const o of list){ markCleared(o.id, o.ttn); }
  log("ClearedTTNs LS marker set for " + list.length + " orders");
  const ids = list.map(o => o.id);
  const chunkSize = 200;
  for(let i = 0; i < ids.length; i += chunkSize){
    const chunk = ids.slice(i, i + chunkSize);
    const { error } = await sb.from("orders").update({
      ttn: "",
      status: "new",
      np_status_code: null,
      np_status_text: null,
      updated_at: new Date().toISOString()
    }).in("id", chunk);
    if(error){
      log("FAIL chunk " + (Math.floor(i/chunkSize)+1) + " (" + chunk.length + " rows): " + error.message);
      fail += chunk.length;
    } else {
      ok += chunk.length;
      log("OK chunk " + (Math.floor(i/chunkSize)+1) + ": cleared " + chunk.length + " rows");
    }
  }
  log("");
  log("Done. OK: " + ok + ", FAIL: " + fail);
  if(fail === 0){
    log("");
    log("Готово! Поверніться в основний CRM, зробіть Ctrl+Shift+R.");
    log("Тi заказы залишаться без ТТН i зi статусом 'Новий'.");
  }
  el("clearDeletedBtn").disabled = false;
  el("clearAllBtn").disabled = false;
}

window.addEventListener("DOMContentLoaded", function(){
  el("loadBtn").addEventListener("click", load);
  el("clearDeletedBtn").addEventListener("click", () => clearList(deletedOnNP, "Видалені на НП"));
  el("clearAllBtn").addEventListener("click", () => clearList(allWithTtn, "ВСI з ТТН"));
});

</script>
</body>
</html>
